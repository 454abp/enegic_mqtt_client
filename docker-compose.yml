services:
  enegic_mqtt:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - logs:/logs
    environment:
      ENEGIC_CONFIG_FILE: /app/config.yaml
      # ENEGIC_LOG_LEVEL: INFO       # DEBUG / INFO / WARNING
      # ENEGIC_LOG_MAX_BYTES: 10485760  # 10 MB per file
      # ENEGIC_LOG_BACKUPS: 5           # keep 5 rotated files
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  logs:
